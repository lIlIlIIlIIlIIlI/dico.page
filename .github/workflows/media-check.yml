name: Media checks

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q api
      - run: node --check api/static/js/image-attachments.js
      - run: node --check api/static/js/media-upload-queue.js
      - run: node --check api/static/js/file-attachments.js
      - run: node tests/test_media_picker.cjs
      - run: node tests/test_inline_photo_picker.cjs
      - run: node tests/test_parallel_upload.cjs
      - run: node tests/test_plyr_preview.cjs
      - run: node tests/test_video_poster.cjs
      - run: node --check api/static/js/media-drafts.js
      - run: python -m unittest discover -s tests -v
