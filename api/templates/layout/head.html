<style>
    [data-dico-player-frame] .plyr {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
    }
    [data-dico-player-frame] .plyr--fullscreen-active { aspect-ratio: auto; }
    .plyr { --plyr-color-main: var(--color-primary); }

    .dico-markdown {
        overflow-wrap: anywhere;
        font-size: 0.95rem;
        line-height: 1.85;
    }

    /* github-markdown-css의 다크 모드 자동 적용을 본문까지 전파하지 않습니다. */
    .markdown-body.dico-markdown {
        background-color: transparent !important;
        color: var(--color-base-content) !important;
    }
    .markdown-body.dico-markdown > :not(pre) {
        color: inherit;
    }

    .dico-markdown > :first-child { margin-top: 0; }
    .dico-markdown > :last-child { margin-bottom: 0; }
    .dico-markdown h1,
    .dico-markdown h2,
    .dico-markdown h3 {
        margin: 1.75em 0 0.65em;
        font-weight: 750;
        line-height: 1.35;
    }
    .dico-markdown h1 { font-size: 1.75rem; }
    .dico-markdown h2 { font-size: 1.4rem; }
    .dico-markdown h3 { font-size: 1.15rem; }
    .dico-markdown p { margin: 0.85em 0; }
    .dico-markdown ul,
    .dico-markdown ol { margin: 0.85em 0; padding-left: 1.6rem; }
    .dico-markdown ul { list-style: disc; }
    .dico-markdown ol { list-style: decimal; }
    .dico-markdown blockquote {
        margin: 1.1rem 0;
        border-left: 4px solid var(--color-primary);
        padding: 0.25rem 1rem;
        color: color-mix(in oklab, currentColor 65%, transparent);
        background: color-mix(in oklab, var(--color-base-200) 75%, transparent);
    }
    .dico-markdown a { color: var(--color-primary); text-decoration: underline; text-underline-offset: 3px; }
    .dico-markdown code {
        border-radius: 0.35rem;
        background: var(--color-base-200);
        padding: 0.15rem 0.4rem;
        font-size: 0.9em;
    }
    .dico-markdown pre {
        position: relative;
        width: 100%;
        margin: 1rem 0;
        overflow-x: auto;
        border: 1px solid color-mix(in oklab, var(--color-neutral-content) 14%, transparent);
        border-radius: 0.75rem;
        background: var(--color-neutral);
        padding: 1rem;
        color: var(--color-neutral-content);
        white-space: pre;
    }
    .dico-markdown pre[data-language]::before {
        display: block;
        margin: -0.2rem 0 0.65rem;
        color: color-mix(in oklab, var(--color-neutral-content) 55%, transparent);
        content: attr(data-language);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        text-transform: uppercase;
    }
    .dico-markdown pre code {
        display: block;
        min-width: max-content;
        background: transparent;
        padding: 0;
        color: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        line-height: 1.65;
    }
    /* highlight.js의 언어별 토큰 색상 */
    .dico-markdown pre code.hljs { color: #e6edf3; background: transparent; }
    .dico-markdown pre code .hljs-comment,
    .dico-markdown pre code .hljs-quote { color: #8b949e; font-style: italic; }
    .dico-markdown pre code .hljs-keyword,
    .dico-markdown pre code .hljs-selector-tag,
    .dico-markdown pre code .hljs-literal,
    .dico-markdown pre code .hljs-type,
    .dico-markdown pre code .hljs-built_in { color: #ff7b72; }
    .dico-markdown pre code .hljs-string,
    .dico-markdown pre code .hljs-regexp,
    .dico-markdown pre code .hljs-addition { color: #a5d6ff; }
    .dico-markdown pre code .hljs-number,
    .dico-markdown pre code .hljs-symbol,
    .dico-markdown pre code .hljs-bullet,
    .dico-markdown pre code .hljs-variable { color: #79c0ff; }
    .dico-markdown pre code .hljs-title,
    .dico-markdown pre code .hljs-title.class_,
    .dico-markdown pre code .hljs-title.class_.inherited__,
    .dico-markdown pre code .hljs-title.function_ { color: #d2a8ff; }
    .dico-markdown pre code .hljs-attr,
    .dico-markdown pre code .hljs-attribute,
    .dico-markdown pre code .hljs-name,
    .dico-markdown pre code .hljs-selector-id,
    .dico-markdown pre code .hljs-selector-class { color: #7ee787; }
    .dico-markdown pre code .hljs-meta,
    .dico-markdown pre code .hljs-doctag,
    .dico-markdown pre code .hljs-meta .hljs-keyword { color: #ffa657; }
    .dico-markdown pre code .hljs-deletion { color: #ffa198; }
    .dico-markdown img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 1.25rem 0;
        border-radius: 0.75rem;
    }
    .dico-markdown hr { margin: 1.75rem 0; border-color: var(--color-base-300); }
    .dico-markdown table { width: 100%; margin: 1rem 0; border-collapse: collapse; }
    .dico-markdown th,
    .dico-markdown td { border: 1px solid var(--color-base-300); padding: 0.6rem 0.75rem; text-align: left; }
    .dico-markdown th { background: var(--color-base-200); }

    .dico-media {
        width: 100%;
        margin: 1.25rem 0;
        overflow: hidden;
        border: 1px solid var(--color-base-300);
        border-radius: 0.8rem;
        background: #000;
    }
    .dico-media-frame {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        background: #000;
        object-fit: contain;
    }
    .dico-media-attachment { background: var(--color-base-100); }
    .dico-media-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: var(--color-base-content);
        font-size: 0.875rem;
    }
    .dico-media-caption span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dico-media-caption a { flex-shrink: 0; color: var(--color-primary); }
    .dico-media-instagram-frame {
        width: 100%;

        height: 960px;

        aspect-ratio: auto;

    }
