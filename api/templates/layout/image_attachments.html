<div class="rounded-xl border border-base-300 bg-base-100 p-3 sm:p-4" data-image-attachments>
    <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
            <p class="text-sm font-semibold">이미지·영상 첨부 <span class="font-normal text-base-content/50" data-image-count>0/5</span></p>
            <p class="mt-1 text-xs text-base-content/55">선택 즉시 업로드 · 파일 선택·끌어놓기·이미지 붙여넣기 · 이미지 원본 8MB 이하, 영상 100MB 이하</p>
            <p class="mt-1 text-xs text-base-content/55">영상은 ‘본문에 삽입’을 누른 뒤 #[파일명.mp4] 줄을 원하는 위치로 옮기세요. 미리보기에서 재생할 수 있습니다.</p>
        </div>
        <details class="dropdown dropdown-end" data-image-menu>
            <summary class="btn btn-outline btn-sm cursor-pointer list-none">파일 추가 ▾</summary>
            <ul class="menu dropdown-content z-20 mt-2 w-44 rounded-xl border border-base-300 bg-base-100 p-2 shadow-lg">
                <li><button type="button" data-image-select>파일 선택</button></li>
                <li><button type="button" data-image-paste>이미지 붙여넣기</button></li>
            </ul>
        </details>
    </div>
    <div class="mt-3 rounded-lg border-2 border-dashed border-base-300 bg-base-200/30 p-4 text-center text-sm text-base-content/60 outline-none transition focus-visible:border-primary" data-image-dropzone tabindex="0" role="button" aria-label="이미지 또는 영상 파일 선택 또는 끌어놓기">
        여기에 파일을 끌어놓거나 클릭하여 여러 파일을 선택하세요.
    </div>
    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/ogg" multiple class="hidden" data-image-picker>
    <ul class="mt-3 space-y-2" data-image-list aria-live="polite"></ul>
    <p class="mt-2 text-xs text-base-content/55" data-image-status role="status" aria-live="polite">작성 칸에서 Ctrl+V로 복사한 이미지도 추가할 수 있습니다.</p>
</div>
