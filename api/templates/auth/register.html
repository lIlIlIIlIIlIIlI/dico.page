{% extends "base.html" %}

{% block title %}회원가입 | Dico.page{% endblock %}

{% block content %}
<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-base-200 px-4 py-10">
    <div class="w-full max-w-md rounded-2xl border border-base-300 bg-base-100 p-6 shadow-sm sm:p-8">
        <div class="mb-7">
            <h1 class="text-2xl font-bold">회원가입</h1>
            <p class="mt-2 text-sm text-base-content/60">사용할 계정 정보를 입력해 주세요.</p>
        </div>

        {% if error %}
        <div role="alert" class="alert alert-error mb-5 text-sm">
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.register') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label class="form-control block">
                <span class="mb-2 block text-sm font-medium">닉네임</span>
                <input type="text" name="nickname" value="{{ nickname }}" class="input input-bordered w-full" placeholder="2~20자" autocomplete="nickname" minlength="2" maxlength="20" required autofocus>
                <span class="mt-1 block text-xs text-base-content/40">한글, 영문, 숫자, 밑줄을 사용할 수 있습니다.</span>
            </label>

            <label class="form-control block">
                <span class="mb-2 block text-sm font-medium">이메일</span>
                <input type="email" name="email" value="{{ email }}" class="input input-bordered w-full" placeholder="name@example.com" autocomplete="email" maxlength="254" required>
            </label>

            <label class="form-control block">
                <span class="mb-2 block text-sm font-medium">비밀번호</span>
                <input type="password" name="password" class="input input-bordered w-full" placeholder="8자 이상" autocomplete="new-password" minlength="8" maxlength="128" required>
            </label>

            <label class="form-control block">
                <span class="mb-2 block text-sm font-medium">비밀번호 확인</span>
                <input type="password" name="password_confirm" class="input input-bordered w-full" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" minlength="8" maxlength="128" required>
            </label>

            <button type="submit" class="btn btn-primary w-full">가입하고 시작하기</button>
        </form>

        <p class="mt-6 text-center text-sm text-base-content/60">
            이미 계정이 있으신가요?
            <a href="{{ url_for('auth.login') }}" class="font-medium text-primary hover:underline">로그인</a>
        </p>
    </div>
</section>
{% endblock %}
