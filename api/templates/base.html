<!DOCTYPE html>
<html lang="ko">
<head>
    <title>{% block title %}게시판{% endblock %}</title>
    {% include "layout/head.html" %}




</head>
<body class="min-h-screen bg-base-100">
    {% include "layout/header.html" %}

    <main id="app-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/media-upload-queue.js') }}"></script>
    <script src="{{ url_for('static', filename='js/image-attachments.js') }}"></script>
    <script src="{{ url_for('static', filename='js/media-drafts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/file-attachments.js') }}"></script>
    <script src="{{ url_for('static', filename='js/download-attachments.js') }}"></script>
    <script src="https://cdn.plyr.io/3.8.4/plyr.js"></script>
    <script src="{{ url_for('static', filename='js/plyr-media.js') }}"></script>
    <div id="app-page-scripts">
        {% block scripts %}{% endblock %}
    </div>

    <div id="app-navigation-progress" class="fixed left-0 top-0 z-[9999] hidden h-0.5 bg-primary transition-[width] duration-200" aria-hidden="true"></div>

    <script>
    (() => {
        const languageNames = {
            bash: 'Bash', shell: 'Shell', sh: 'Shell',
            c: 'C', cpp: 'C++', 'c++': 'C++', csharp: 'C#', cs: 'C#',
            css: 'CSS', go: 'Go', html: 'HTML', xml: 'HTML',
            java: 'Java', javascript: 'JavaScript', js: 'JavaScript',
            json: 'JSON', kotlin: 'Kotlin', markdown: 'Markdown', md: 'Markdown',
            php: 'PHP', plaintext: 'Text', python: 'Python', py: 'Python',
            ruby: 'Ruby', rust: 'Rust', sql: 'SQL', typescript: 'TypeScript', ts: 'TypeScript',
        };

        function displayLanguage(value) {
            const normalized = String(value || '').toLowerCase();
            return languageNames[normalized] || normalized || '';
        }

        function highlightMarkdown(root = document) {
            if (!window.hljs || !root?.querySelectorAll) return;
            root.querySelectorAll('.dico-markdown pre code:not(.hljs)').forEach((code) => {
                const declared = Array.from(code.classList)
                    .find((className) => className.startsWith('language-'));
                const declaredLanguage = declared?.slice('language-'.length) || '';
                try {
                    window.hljs.highlightElement(code);
                } catch (error) {
                    // 알 수 없는 언어는 원문을 그대로 보여줍니다.
                    return;
                }

                const detectedLanguage = code.result?.language || declaredLanguage;
                const label = displayLanguage(declaredLanguage || detectedLanguage);
                if (label) code.closest('pre')?.setAttribute('data-language', label);
            });
        }

        let highlightFrame = 0;
        function scheduleHighlight(root = document) {
            window.cancelAnimationFrame(highlightFrame);
            highlightFrame = window.requestAnimationFrame(() => highlightMarkdown(root));
        }

        window.DicoHighlight = { apply: scheduleHighlight };
        window.addEventListener('DOMContentLoaded', () => scheduleHighlight());
        window.addEventListener('app:navigation-end', () => scheduleHighlight());

        const observer = new MutationObserver(() => scheduleHighlight());
        observer.observe(document.body, { childList: true, subtree: true });
    })();

    (() => {
        if (window.__appNavigationInitialized) return;
        window.__appNavigationInitialized = true;

        const parser = new DOMParser();
        const progress = document.getElementById('app-navigation-progress');
        let navigationController = null;

        function setProgress(width) {
            progress.classList.remove('hidden');
            progress.style.width = `${width}%`;
        }

        function finishProgress() {
            progress.style.width = '100%';
            window.setTimeout(() => {
                progress.classList.add('hidden');
                progress.style.width = '0%';
            }, 180);
        }

        function executePageScripts(nextHost) {
            const currentHost = document.getElementById('app-page-scripts');
            currentHost.replaceChildren();

            Array.from(nextHost.childNodes).forEach((node) => {
                if (node.nodeName !== 'SCRIPT') {
                    currentHost.appendChild(document.importNode(node, true));
                    return;
                }

                const script = document.createElement('script');
                Array.from(node.attributes).forEach((attribute) => {
                    script.setAttribute(attribute.name, attribute.value);
                });
                script.textContent = node.textContent;
                currentHost.appendChild(script);
            });
        }

        async function navigate(target, options = {}) {
            const url = new URL(target, window.location.href);
            const historyMode = options.historyMode || 'push';

            navigationController?.abort();
            const controller = new AbortController();
            navigationController = controller;
            setProgress(28);

            try {
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'text/html',
                        'X-App-Navigation': '1'
                    },
                    signal: controller.signal
                });

                if (!response.ok) throw new Error(`페이지 요청 실패: ${response.status}`);

                setProgress(72);
                const html = await response.text();
                const nextDocument = parser.parseFromString(html, 'text/html');
                const nextContent = nextDocument.getElementById('app-content');
                const nextScripts = nextDocument.getElementById('app-page-scripts');

                if (!nextContent || !nextScripts) throw new Error('부분 전환 영역을 찾을 수 없습니다.');

                window.dispatchEvent(new CustomEvent('app:navigation-start'));
                document.getElementById('app-content').replaceWith(nextContent);
                executePageScripts(nextScripts);

                const nextUrl = response.url || url.href;
                if (historyMode === 'push') history.pushState({}, '', nextUrl);
                if (historyMode === 'replace') history.replaceState({}, '', nextUrl);

                document.title = nextDocument.title;
                window.dispatchEvent(new CustomEvent('app:title-change', {
                    detail: { title: nextDocument.title }
                }));

                if (options.scroll !== false) window.scrollTo({ top: 0, behavior: 'auto' });
                window.dispatchEvent(new CustomEvent('app:navigation-end', {
                    detail: { url: nextUrl }
                }));
                finishProgress();
            } catch (error) {
                if (error.name === 'AbortError') return;
                finishProgress();
                window.location.assign(url.href);
            }
        }

        function getNavigableUrl(anchor) {
            if (!anchor?.closest('[data-async-page]')) return null;
            if (anchor.target || anchor.hasAttribute('download')) return null;

            const url = new URL(anchor.href, window.location.href);
            if (url.origin !== window.location.origin) return null;
            if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return null;
            return url;
        }

        document.addEventListener('click', (event) => {
            if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

            const anchor = event.target.closest('a[href]');
            const url = getNavigableUrl(anchor);
            if (!url) return;

            event.preventDefault();
            navigate(url.href);
        });

        document.addEventListener('submit', (event) => {
            const form = event.target;
            if (!(form instanceof HTMLFormElement) || !form.closest('[data-async-page]')) return;
            if ((form.method || 'get').toLowerCase() !== 'get') return;

            event.preventDefault();
            const url = new URL(form.action || window.location.href);
            url.search = '';
            new FormData(form).forEach((value, key) => url.searchParams.append(key, String(value)));
            navigate(url.href);
        });

        window.addEventListener('popstate', () => {
            navigate(window.location.href, { historyMode: 'none', scroll: false });
        });

        window.appNavigate = navigate;
    })();
    </script>
</body>
</html>
