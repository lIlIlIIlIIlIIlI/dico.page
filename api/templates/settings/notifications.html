{% extends "base.html" %}

{% block title %}알림 설정 | Dico.page{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-4rem)] bg-base-200">
    <div class="mx-auto grid w-full max-w-7xl items-start gap-6 px-4 py-8 lg:grid-cols-[220px_minmax(0,1fr)]">
        {% include "settings/sidebar.html" %}
        <div class="min-w-0">
            <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
                <div>
                    <h1 class="text-2xl font-bold">알림 설정</h1>
                    <p class="mt-1 text-sm text-base-content/60">받고 싶은 알림 종류를 선택할 수 있습니다.</p>
                </div>

                <div id="notification-save-status" class="badge badge-ghost gap-2" role="status" aria-live="polite">
                    <span class="size-2 rounded-full bg-success"></span>
                    <span>저장됨</span>
                </div>
            </div>

            <div class="space-y-4">
                <section class="rounded-2xl border border-base-300 bg-base-100 shadow-sm">
                    <label class="flex cursor-pointer items-center justify-between gap-4 p-5 sm:p-6">
                        <span class="min-w-0">
                            <span class="block font-semibold">전체 알림</span>
                            <span class="mt-1 block text-sm text-base-content/60">모든 사이트 알림을 한 번에 켜거나 끕니다.</span>
                        </span>

                        <input
                            id="notification-all-enabled"
                            type="checkbox"
                            class="toggle toggle-primary shrink-0"
                            {% if notification_settings.all_enabled %}checked{% endif %}
                        >
                    </label>
                </section>

                <section id="notification-category-card" class="overflow-hidden rounded-2xl border border-base-300 bg-base-100 shadow-sm transition-opacity">
                    <div class="border-b border-base-300 px-5 py-4 sm:px-6">
                        <h2 class="font-semibold">알림 종류</h2>
                        <p class="mt-1 text-sm text-base-content/50">항목별로 알림 수신 여부를 설정합니다.</p>
                    </div>

                    <div class="divide-y divide-base-300">
                        <label class="flex cursor-pointer items-center justify-between gap-4 p-5 sm:px-6">
                            <span class="min-w-0">
                                <span class="block font-medium">소식 알림</span>
                                <span class="mt-1 block text-sm text-base-content/50">운영 공지와 중요한 안내를 받습니다.</span>
                            </span>
                            <input
                                type="checkbox"
                                data-notification-setting="notice_enabled"
                                class="toggle toggle-primary shrink-0"
                                {% if notification_settings.notice_enabled %}checked{% endif %}
                            >
                        </label>

                        <label class="flex cursor-pointer items-center justify-between gap-4 p-5 sm:px-6">
                            <span class="min-w-0">
                                <span class="block font-medium">활동 알림</span>
                                <span class="mt-1 block text-sm text-base-content/50">댓글, 답글 등 내 활동과 관련된 알림을 받습니다.</span>
                            </span>
                            <input
                                type="checkbox"
                                data-notification-setting="activity_enabled"
                                class="toggle toggle-primary shrink-0"
                                {% if notification_settings.activity_enabled %}checked{% endif %}
                            >
                        </label>

                        <label class="flex cursor-pointer items-center justify-between gap-4 p-5 sm:px-6">
                            <span class="min-w-0">
                                <span class="block font-medium">혜택 알림</span>
                                <span class="mt-1 block text-sm text-base-content/50">이벤트와 새로운 혜택 소식을 받습니다.</span>
                            </span>
                            <input
                                type="checkbox"
                                data-notification-setting="benefit_enabled"
                                class="toggle toggle-primary shrink-0"
                                {% if notification_settings.benefit_enabled %}checked{% endif %}
                            >
                        </label>
                    </div>
                </section>
            </div>
        </div>
    </div>
</section>
{% endblock %}


{% block scripts %}
<script>
(() => {
    const allToggle = document.getElementById('notification-all-enabled');
    const categoryCard = document.getElementById('notification-category-card');
    const categoryToggles = Array.from(document.querySelectorAll('[data-notification-setting]'));
    const status = document.getElementById('notification-save-status');
    const statusDot = status.querySelector('span:first-child');
    const statusText = status.querySelector('span:last-child');
    const saveUrl = {{ url_for('notifications.update_notification_settings') | tojson }};
    const csrfToken = {{ csrf_token | tojson }};
    let saveController = null;
    let savedSettings = readSettings();

    function readSettings() {
        const settings = {
            all_enabled: allToggle.checked,
            notice_enabled: false,
            activity_enabled: false,
            benefit_enabled: false
        };

        categoryToggles.forEach((toggle) => {
            settings[toggle.dataset.notificationSetting] = toggle.checked;
        });
        return settings;
    }

    function applySettings(settings) {
        allToggle.checked = settings.all_enabled;
        categoryToggles.forEach((toggle) => {
            toggle.checked = settings[toggle.dataset.notificationSetting];
        });
        updateCategoryState();
    }

    function updateCategoryState() {
        const disabled = !allToggle.checked;
        categoryCard.classList.toggle('opacity-50', disabled);
        categoryToggles.forEach((toggle) => {
            toggle.disabled = disabled;
        });
    }

    function setStatus(type, message) {
        status.className = `badge gap-2 ${type === 'error' ? 'badge-error' : 'badge-ghost'}`;
        statusDot.className = `size-2 rounded-full ${type === 'saving' ? 'animate-pulse bg-warning' : type === 'error' ? 'bg-error-content' : 'bg-success'}`;
        statusText.textContent = message;
    }

    async function saveSettings() {
        saveController?.abort();
        const controller = new AbortController();
        saveController = controller;
        const settings = readSettings();
        setStatus('saving', '저장 중');

        try {
            const response = await fetch(saveUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken
                },
                body: JSON.stringify(settings),
                signal: controller.signal
            });
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || '알림 설정을 저장하지 못했습니다.');
            }

            savedSettings = data.settings;
            setStatus('saved', '저장됨');
        } catch (error) {
            if (error.name === 'AbortError') return;
            applySettings(savedSettings);
            setStatus('error', '저장 실패');
        }
    }

    allToggle.addEventListener('change', () => {
        updateCategoryState();
        saveSettings();
    });

    categoryToggles.forEach((toggle) => {
        toggle.addEventListener('change', saveSettings);
    });

    window.addEventListener('pagehide', () => {
        saveController?.abort();
    }, { once: true });

    updateCategoryState();
})();
</script>
{% endblock %}
